[project]
name = "python-courseware"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "google-cloud-aiplatform>=1.165.1",
    "langchain-community<0.4",
    "langchain-google-vertexai>=3.2.4",
    "litellm>=1.97.0",
    "llama-index>=0.14.24",
    "onnxruntime>=1.29.0",
    "peft>=0.20.0",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.5",
    "smolagents>=1.26.0",
    "tokencost>=0.1.26",
    "trl>=1.10.0",
    "uvicorn>=0.52.3",
]

[project.optional-dependencies]
courseware = [
  "anthropic",
  "fastapi",
  "google-genai",
  "huggingface-hub",
  "httpx",
  "instructor[google-genai]",
  "jupyterlab",
  "nbclient",
  "nbformat",
  "numpy",
  "openai",
  "pandas",
  "pydantic",
  "pytest",
  "python-dotenv",
  "requests",
  "scikit-learn",
  "sqlalchemy",
  "torch",
  "transformers",
  "litellm>=1.97.0",
  "tokencost>=0.1.26",
]
